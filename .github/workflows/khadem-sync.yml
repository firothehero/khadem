# Khadem: weekly merge of upstream NousResearch/hermes-agent with the Arabic-layer gate.
# Opens (or updates) a pull request from `khadem/upstream-sync` so a human reviews every sync.
name: Khadem upstream sync

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: khadem-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'NousResearch/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Configure git
        run: |
          git config user.name "khadem-sync[bot]"
          git config user.email "khadem-sync@users.noreply.github.com"
      - name: Merge upstream
        id: merge
        run: |
          git checkout -B khadem/upstream-sync
          SKIP_CHECKS=1 scripts/khadem/sync-upstream.sh | tee merge.log
          if git diff --quiet origin/${{ github.event.repository.default_branch }} HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Khadem checks
        if: steps.merge.outputs.changed == 'true'
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e . pytest pytest-asyncio pytest-timeout
          PYTHON=.venv/bin/python scripts/khadem/check.sh | tee check.log
      - name: Push branch and open PR
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push --force-with-lease origin khadem/upstream-sync
          body=$(printf 'Automated merge of upstream hermes-agent `main`.\n\n```\n%s\n```\n\nKhadem checks:\n```\n%s\n```\n' \
            "$(tail -n 5 merge.log)" "$(tail -n 8 check.log)")
          gh pr view khadem/upstream-sync >/dev/null 2>&1 \
            && gh pr edit khadem/upstream-sync --body "$body" \
            || gh pr create --head khadem/upstream-sync --title "Sync upstream hermes-agent" --body "$body"
